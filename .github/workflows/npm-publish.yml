# Publish all @losi-ai/* packages when a GitHub Release is created.
#
# Prerequisites (one-time):
# 1. Create the npm org/user that owns scope `@losi-ai`
# 2. Create an npm Automation access token with publish rights
# 3. Add it as repo secret: Settings → Secrets → Actions → NPM_TOKEN
#
# Then: GitHub → Releases → Draft a new release (tag v0.1.0) → Publish

name: Publish npm packages

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:serial

      - name: Test
        run: npm test

      # Root package is private; publish each workspace package that has
      # publishConfig.access=public. Order matches build:serial so peers resolve.
      - name: Publish @losi-ai packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          pkgs=(
            core openai anthropic gemini mistral cohere groq ollama
            mcp nexus spaces skills governance react
          )
          for p in "${pkgs[@]}"; do
            echo "=== publishing @losi-ai/$p ==="
            npm publish -w "@losi-ai/$p" --access public --provenance
          done
